[package]
name = "live_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
