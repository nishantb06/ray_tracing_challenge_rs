[package]
name = "shape_composer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
image = "0.25.10"
ray_tracing_challenge_rs = { version = "0.1.0", path = ".." }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4"] }
